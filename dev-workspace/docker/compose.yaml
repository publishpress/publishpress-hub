name: ${CONTAINER_NAME}

services:
    ##############################################################################
    # Terminal
    ##############################################################################
    terminal:
        build: ./terminal/
        profiles: ["term"]
        container_name: ${CONTAINER_NAME}-env-terminal
        image: ${TERMINAL_IMAGE_NAME}
        command: ["zsh"]
        stdin_open: true
        tty: true
        working_dir: "/project"
        user: "devuser"
        volumes:
            - ../../:/project
            - ../.cache/terminal/.zsh_history:/home/devuser/.zsh_history
            - ../.cache/terminal/.bash_history:/home/devuser/.bash_history
            - ../.cache/terminal/.npm/_cacache:/home/devuser/.npm/_cacache
            - ../.cache/terminal/.npm/_logs:/home/devuser/.npm/_logs
            - ../.cache/terminal/.composer/cache:/home/devuser/.composer/cache
            - ../.cache/terminal/.composer/auth.json:/home/devuser/.composer/auth.json
    ##############################################################################
    # Tests
    ##############################################################################
    test-db:
        image: mariadb:latest
        profiles: ["test"]
        container_name: ${CONTAINER_NAME}-env-test-db
        restart: always
        environment:
            MARIADB_DATABASE: wordpress
            MARIADB_USER: wordpress
            MARIADB_PASSWORD: wordpress
            MARIADB_ROOT_PASSWORD: root
        ports:
          - "3331:3306"
        volumes:
            - ../.cache/test-db/mysql:/var/lib/mysql
            - ../.cache/test-db/logs:/var/log/mysql
            - ./wp/db/conf.d/my.cnf:/etc/mysql/conf.d/my.cnf
        healthcheck:
            test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
            start_period: 10s
            retries: 3
    test-wp:
        build: ./wp/wordpress
        profiles: ["test"]
        image: ${WP_IMAGE_NAME}
        container_name: ${CONTAINER_NAME}-env-test-wp
        restart: always
        environment:
            WORDPRESS_DB_HOST: test-db
            WORDPRESS_DB_USER: wordpress
            WORDPRESS_DB_PASSWORD: wordpress
            WORDPRESS_DB_NAME: wordpress
            WORDPRESS_DEBUG: true
        ports:
            - "8031:80"
        volumes:
          - ../.cache/test-wp/html:/var/www/html/
          - ../.cache/test-wp/tmp:/tmp/
          - ../../tests/Support/Data/Plugins/dummy-plugin-1:/var/www/html/wp-content/plugins/dummy-plugin-1
          - ../../tests/Support/Data/Plugins/dummy-plugin-2:/var/www/html/wp-content/plugins/dummy-plugin-2
          - ../../tests/Support/Data/Plugins/prototype:/var/www/html/wp-content/plugins/hub-prototype
          - ../../tests/Support/Data/Plugins/dummy-authors-free:/var/www/html/wp-content/plugins/publishpress-authors
          - ../../:/var/www/html/wp-content/plugins/publishpress-hub
          - ./wp/wordpress/conf.d/98-xdebug.ini:/usr/local/etc/php/conf.d/98-xdebug.ini
          - ./wp/wordpress/conf.d/99-custom.ini:/usr/local/etc/php/conf.d/99-custom.ini
          - ./wp/wordpress/mu-plugins/load-spatie-ray.php:/var/www/html/wp-content/mu-plugins/load-spatie-ray.php
          - ./wp/wordpress/mu-plugins/pp-mailhog.php:/var/www/html/wp-content/mu-plugins/pp-mailhog.php
          - ./wp/wordpress/ray.php:/var/www/html/ray.php
          - ../../:/project
        depends_on:
            test-db:
                condition: service_healthy
            mailhog:
                condition: service_started
        links:
            - test-db
            - mailhog
        healthcheck:
            test: ["CMD", "test", "-f", "/var/www/html/wp-config.php"]
            retries: 3
        extra_hosts:
            - "host.docker.internal:host-gateway"
    test-wpcli:
        build: ./wp/wpcli
        image: ${WPCLI_IMAGE_NAME}
        profiles: ["test"]
        container_name: ${CONTAINER_NAME}-env-test-wpcli
        environment:
            WORDPRESS_DB_HOST: test-db
            WORDPRESS_DB_USER: wordpress
            WORDPRESS_DB_PASSWORD: wordpress
            WORDPRESS_DB_NAME: wordpress
        volumes:
            - ../.cache/test-wp/html:/var/www/html/
            - ../.cache/test-wpcli/tmp:/tmp/
            - ../../tests/Support/Data/Plugins/dummy-plugin-1:/var/www/html/wp-content/plugins/dummy-plugin-1
            - ../../tests/Support/Data/Plugins/dummy-plugin-2:/var/www/html/wp-content/plugins/dummy-plugin-2
            - ../../tests/Support/Data/Plugins/prototype:/var/www/html/wp-content/plugins/hub-prototype
            - ../../:/var/www/html/wp-content/plugins/publishpress-hub
            - ./wp/wpcli/prepare-wp.sh:/tmp/prepare-wp.sh
            - ./wp/wpcli/conf.d/my.cnf:/tmp/my.cnf
            - ./wp/wordpress/conf.d/98-xdebug.ini:/usr/local/etc/php/conf.d/98-xdebug.ini
            - ./wp/wordpress/conf.d/99-custom.ini:/usr/local/etc/php/conf.d/99-custom.ini
            - ../../:/project
        depends_on:
            test-wp:
                condition: service_healthy
            test-db:
                condition: service_healthy
            mailhog:
                condition: service_started
        links:
            - test-wp
            - test-db
            - mailhog
        working_dir: /var/www/html
        command: ["/bin/sh", "-c", "sh /tmp/prepare-wp.sh http://localhost:8031 publishpress-hub TEST"]
        extra_hosts:
            - "host.docker.internal:host-gateway"
        healthcheck:
            test: ["CMD", "test", "-f", "/tmp/prepare-wp.sh.done"]
            start_period: 5s
            retries: 20
            interval: 3s

    ##############################################################################
    # Development
    ##############################################################################
    dev-db:
        image: mariadb:latest
        profiles: ["dev"]
        container_name: ${CONTAINER_NAME}-env-dev-db
        restart: always
        environment:
            MARIADB_DATABASE: wordpress
            MARIADB_USER: wordpress
            MARIADB_PASSWORD: wordpress
            MARIADB_ROOT_PASSWORD: root
        ports:
          - "3332:3306"
        volumes:
            - ../.cache/dev-db/mysql:/var/lib/mysql
            - ../.cache/dev-db/logs:/var/log/mysql
            - ./wp/db/conf.d/my.cnf:/etc/mysql/conf.d/my.cnf
        healthcheck:
            test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
            start_period: 10s
            retries: 3
    dev-wp:
        build: ./wp/wordpress
        profiles: ["dev"]
        image: ${WP_IMAGE_NAME}
        container_name: ${CONTAINER_NAME}-env-dev-wp
        restart: always
        environment:
            WORDPRESS_DB_HOST: dev-db
            WORDPRESS_DB_USER: wordpress
            WORDPRESS_DB_PASSWORD: wordpress
            WORDPRESS_DB_NAME: wordpress
            WORDPRESS_DEBUG: true
        ports:
            - "8032:80"
        volumes:
          - ../.cache/dev-wp/html:/var/www/html/
          - ../.cache/dev-wp/tmp:/tmp/
          - ../../tests/Support/Data/Plugins/dummy-plugin-1:/var/www/html/wp-content/plugins/dummy-plugin-1
          - ../../tests/Support/Data/Plugins/dummy-plugin-2:/var/www/html/wp-content/plugins/dummy-plugin-2
          - ../../tests/Support/Data/Plugins/prototype:/var/www/html/wp-content/plugins/hub-prototype
          - ../../:/var/www/html/wp-content/plugins/publishpress-hub
          - ./wp/wordpress/conf.d/98-xdebug.ini:/usr/local/etc/php/conf.d/98-xdebug.ini
          - ./wp/wordpress/conf.d/99-custom.ini:/usr/local/etc/php/conf.d/99-custom.ini
          - ./wp/wordpress/mu-plugins/load-spatie-ray.php:/var/www/html/wp-content/mu-plugins/load-spatie-ray.php
          - ./wp/wordpress/mu-plugins/pp-mailhog.php:/var/www/html/wp-content/mu-plugins/pp-mailhog.php
          - ./wp/wordpress/ray.php:/var/www/html/ray.php
          - ../../:/project
        depends_on:
            dev-db:
                condition: service_healthy
            mailhog:
                condition: service_started
        links:
            - dev-db
            - mailhog
        healthcheck:
            test: ["CMD", "test", "-f", "/var/www/html/wp-config.php"]
            retries: 3
        extra_hosts:
            - "host.docker.internal:host-gateway"
    dev-wpcli:
        build: ./wp/wpcli
        image: ${WPCLI_IMAGE_NAME}
        profiles: ["dev"]
        container_name: ${CONTAINER_NAME}-env-dev-wpcli
        environment:
            WORDPRESS_DB_HOST: dev-db
            WORDPRESS_DB_USER: wordpress
            WORDPRESS_DB_PASSWORD: wordpress
            WORDPRESS_DB_NAME: wordpress
        volumes:
            - ../.cache/dev-wp/html:/var/www/html/
            - ../.cache/dev-wpcli/tmp:/tmp/
            - ../../tests/Support/Data/Plugins/dummy-plugin-1:/var/www/html/wp-content/plugins/dummy-plugin-1
            - ../../tests/Support/Data/Plugins/dummy-plugin-2:/var/www/html/wp-content/plugins/dummy-plugin-2
            - ../../tests/Support/Data/Plugins/prototype:/var/www/html/wp-content/plugins/hub-prototype
            - ../../:/var/www/html/wp-content/plugins/publishpress-hub
            - ./wp/wpcli/prepare-wp.sh:/tmp/prepare-wp.sh
            - ./wp/wpcli/conf.d/my.cnf:/tmp/my.cnf
            - ./wp/wordpress/conf.d/98-xdebug.ini:/usr/local/etc/php/conf.d/98-xdebug.ini
            - ./wp/wordpress/conf.d/99-custom.ini:/usr/local/etc/php/conf.d/99-custom.ini
            - ../../:/project
        depends_on:
            dev-wp:
                condition: service_healthy
            dev-db:
                condition: service_healthy
            mailhog:
                condition: service_started
        links:
            - dev-wp
            - dev-db
            - mailhog
        working_dir: /var/www/html
        command: ["/bin/sh", "-c", "sh /tmp/prepare-wp.sh http://localhost:8032 publishpress-hub DEV"]
        extra_hosts:
            - "host.docker.internal:host-gateway"
        healthcheck:
            test: ["CMD", "test", "-f", "/tmp/prepare-wp.sh.done"]
            start_period: 5s
            retries: 20
            interval: 3s

    ##############################################################################
    # Mailhog
    ##############################################################################
    mailhog:
        image: mailhog/mailhog:latest
        profiles: ["dev", "test"]
        container_name: ${CONTAINER_NAME}-env-mailhog
        ports:
            - "8033:8025" # Web UI
            - "8034:1025" # SMTP server
        environment:
            - MH_STORAGE=maildir
            - MH_MAILDIR_PATH=/maildir
        volumes:
            - ../.cache/mailhog/maildir:/maildir
        restart: always
        user: root


