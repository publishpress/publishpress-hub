actor: ApiTester
suite_namespace: Tests\Api
bootstrap: _bootstrap.php
env:
    EDD_LICENSE_FOR_TESTS: %EDD_LICENSE_FOR_TESTS%
modules:
    # enable helpers as array
    enabled:
        - lucatume\WPBrowser\Module\WPLoader
        - REST:
            url: %WP_TEST_URL%/wp-json/
            depends: PhpBrowser
            part: Json
    config:
        lucatume\WPBrowser\Module\WPLoader:
            wpRootFolder: "%WP_TEST_ROOT_DIR%"
            dbUrl: "%WP_TEST_DB_URL%"
            wpDebug: true
            tablePrefix: '%WP_TEST_TEST_TABLE_PREFIX%'
            domain: '%WP_TEST_DOMAIN%'
            adminEmail: 'admin@%WP_TEST_DOMAIN%'
            dump: 'tests/Support/Data/dump.sql'
            title: 'Integration Tests'
            theme: 'twentytwentyfive'
