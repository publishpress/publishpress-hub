name: Deploy plugin to the GitHub release
on:
  release:
    types: [ published ]

  workflow_dispatch:
    inputs:
      tmate_enabled_pro:
        type: boolean
        description: 'Enable "tmate" for debugging'
        required: false
        default: false

jobs:
  code-check:
    name: Check the code
    uses: ./.github/workflows/code-check.yml
    secrets: inherit

  unit-tests:
    name: Test the code
    uses: ./.github/workflows/unit-tests.yml
    secrets: inherit

  integration-tests:
    name: Test the code
    uses: ./.github/workflows/integration-tests.yml
    secrets: inherit

  deploy-wp-org:
    name: Deploy the new tag
    needs: [code-check, unit-tests, integration-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install linux packages
        run: |
          sudo apt-get update
          sudo apt-get install -y iproute2

      - name: Setup tmate session for Debugging, if inputs.tmate_enabled_pro is true
        uses: mxschmitt/action-tmate@v3
        if: ${{ inputs.tmate_enabled_pro }}
        timeout-minutes: 10
        with:
          detached: true

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Prepare composer
        run: |
          composer config --global github-oauth.github.com ${{ secrets.ACCESS_TOKEN }}
          composer validate
          composer install

      - name: Show version of tools inside the dev-workspace
        run: |
          $GITHUB_WORKSPACE/vendor/publishpress/dev-workspace/scripts/run.sh composer info:versions

      - name: Build the package using ./dev-workspace
        run: |
          $GITHUB_WORKSPACE/vendor/publishpress/dev-workspace/scripts/run.sh composer build

      - name: Get the plugin version number
        id: get-version
        run: |
          VERSION=$($GITHUB_WORKSPACE/vendor/publishpress/dev-workspace/scripts/run.sh pversion)
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ github.workspace }}/dist/publishpress-hub-${{ steps.get-version.outputs.version }}.zip
