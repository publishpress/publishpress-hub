name: Deploy plugin to PublishPress.com
on:
  release:
    types: [ released ]

jobs:
  code-check:
    name: Check the code
    uses: ./.github/workflows/code-standards.yml
    secrets: inherit

  run-unit-tests:
    name: Run unit tests
    uses: ./.github/workflows/unit-tests.yml
    secrets: inherit

  deploy-publishpress-com:
    permissions:
      contents: read
    uses: publishpress/github-workflows/.github/workflows/deploy-pro.yml@v3
    needs: [code-check, run-unit-tests]
    secrets: inherit
