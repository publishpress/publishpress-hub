name: Deploy pro plugin to PublishPress.com
on:
  release:
    types: [ released ]

jobs:
  code-check:
    name: Check the code
    uses: ./.github/workflows/code-standards.yml
    secrets: inherit

  deploy-publishpress:
    permissions:
      contents: write
    uses: publishpress/github-workflows/.github/workflows/deploy-pro.yml@v3
    needs: [code-check]
    secrets: inherit
