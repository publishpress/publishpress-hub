name: Unit and Integration Tests
on:
  push:
    branches:
      - 'master'
      - 'development'
      - 'release/*'
      - 'release-*'

  pull_request:
    branches:
      - '*'

  workflow_call:

  workflow_dispatch:
    inputs:
      tmate_enabled:
        type: boolean
        description: 'Enable "tmate" for debugging'
        required: false
        default: false
jobs:
  check:
    name: Test the code
    runs-on: ubuntu-latest
    steps:
      - name: Setup tmate session for Debugging, if inputs.tmate_enabled is true
        uses: mxschmitt/action-tmate@v3
        if: ${{ inputs.tmate_enabled }}
        timeout-minutes: 10
        with:
          detached: true

      - name: Checkout code
        uses: actions/checkout@master

      - name: Verify Docker installation
        run: docker --version

      - name: Create .env file
        run: |
          cp $GITHUB_WORKSPACE/.env.example $GITHUB_WORKSPACE/.env

      - name: Prepare composer
        run: |
          $GITHUB_WORKSPACE/dev-workspace/run composer validate
          $GITHUB_WORKSPACE/dev-workspace/run composer install

      - name: Start services
        run: |
          composer test:up
        timeout-minutes: 10
        env:
          WP_READY_MAX_ATTEMPTS: 60
          WP_READY_INTERVAL: 5

      - name: Fix permissions
        run: |
          docker ps
          docker exec publishpress-hub-env-test-wp chmod -R 777 /var/www/html/wp-content

      - name: Run Unit Tests
        run: |
          composer test Unit
        timeout-minutes: 5

      - name: Run Integration Tests
        run: |
          composer test Integration
        timeout-minutes: 10

      - name: Run API Tests
        run: |
          composer test API
        timeout-minutes: 5

      - name: Show container logs on failure
        if: failure()
        run: |
          echo "=== Test WordPress Container Logs ==="
          docker logs publishpress-hub-env-test-wp || true
          echo "=== Test WP-CLI Container Logs ==="
          docker logs publishpress-hub-env-test-wpcli || true
          echo "=== Test DB Container Logs ==="
          docker logs publishpress-hub-env-test-db || true


